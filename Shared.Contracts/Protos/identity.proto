//         <Protobuf Include="Protos\identity.proto GrpcServices="Both"/>
syntax = "proto3";

option csharp_namespace = "Shared.Contracts";

package identity;

service IdentityService {
  rpc GetUserEmail (GetUserEmailRequest) returns (GetUserEmailResponse);
}

message GetUserEmailRequest {
  string userId = 1;
}

message GetUserEmailResponse {
  string email = 1;
}